[project]
name = "dossier-mcp"
version = "0.1.0"
description = "Read-only, least-privilege MCP server for the Teable dossier demonstration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2,<3",
    "tenacity>=9,<10",
]

[project.scripts]
dossier-mcp = "dossier_mcp.server:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
